services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    volumes:
      - viking_db_data:/var/lib/mysql
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: vikingtransport
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

  web:
    build: .
    restart: unless-stopped
    ports:
      - 8081:80
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      - db

volumes:
  viking_db_data:
